[package]
name = "eidosdb-server"
description = "gRPC server binary and collection management for EidosDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "eidosd"
path = "src/bin/eidosd.rs"

[dependencies]
eidosdb-core = { path = "../eidosdb-core" }
eidosdb-query = { path = "../eidosdb-query" }
eidosdb-lexical = { path = "../eidosdb-lexical" }
eidosdb-hnsw = { path = "../eidosdb-hnsw" }
eidosdb-storage = { path = "../eidosdb-storage" }
eidosdb-proto = { path = "../eidosdb-proto" }
tonic = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tracing = "0.1"
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
