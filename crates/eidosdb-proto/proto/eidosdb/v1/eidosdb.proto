syntax = "proto3";

package eidosdb.v1;

enum Metric {
  METRIC_UNSPECIFIED = 0;
  METRIC_COSINE = 1;
  METRIC_DOT_PRODUCT = 2;
  METRIC_EUCLIDEAN = 3;
}

enum IndexType {
  INDEX_TYPE_UNSPECIFIED = 0;
  INDEX_TYPE_FLAT = 1;
  INDEX_TYPE_HNSW = 2;
}

message HnswParams {
  // Absent fields take the server default. An explicit zero on m,
  // ef_construction or ef_search is rejected; seed accepts every value.
  optional uint32 m = 1;
  optional uint32 ef_construction = 2;
  optional uint32 ef_search = 3;
  optional uint64 seed = 4;
}

message CreateCollectionRequest {
  string name = 1;
  Metric metric = 2;
  uint32 dimension = 3;
  IndexType index_type = 4;
  optional HnswParams hnsw_params = 5;
}
message CreateCollectionResponse {}

message DropCollectionRequest { string name = 1; }
message DropCollectionResponse { bool existed = 1; }

message ListCollectionsRequest {}
message ListCollectionsResponse { repeated CollectionInfo collections = 1; }

message DescribeCollectionRequest { string name = 1; }
message DescribeCollectionResponse { CollectionInfo collection = 1; }

message CollectionInfo {
  string name = 1;
  Metric metric = 2;
  uint32 dimension = 3;
  IndexType index_type = 4;
  uint64 count = 5;
}

message Value {
  oneof kind {
    string text = 1;
    int64 integer = 2;
    double float_value = 3;
    bool bool_value = 4;
  }
}
message ValueArray { repeated Value values = 1; }
message FieldValue {
  oneof kind {
    Value scalar = 1;
    ValueArray array = 2;
  }
}
message Payload { map<string, FieldValue> fields = 1; }

message Point {
  // Exactly 16 bytes: the UUID in network byte order.
  bytes id = 1;
  repeated float vector = 2;
  optional string document = 3;
  optional Payload payload = 4;
}

message PointBatch {
  string collection = 1;
  repeated Point points = 2;
}

message Comparison { string field = 1; Value value = 2; }
message InFilter { string field = 1; repeated Value values = 2; }
message ContainsFilter { string field = 1; Value value = 2; }
message FilterList { repeated Filter filters = 1; }
message Filter {
  oneof kind {
    Comparison eq = 1;
    Comparison ne = 2;
    Comparison lt = 3;
    Comparison lte = 4;
    Comparison gt = 5;
    Comparison gte = 6;
    InFilter is_in = 7;
    ContainsFilter contains = 8;
    string exists = 9;
    FilterList all_of = 10;
    FilterList any_of = 11;
    Filter negation = 12;
  }
}

message SearchRequest {
  string collection = 1;
  repeated float vector = 2;
  uint32 k = 3;
  optional Metric metric = 4;
  optional Filter filter = 5;
}
message SearchHybridRequest {
  string collection = 1;
  repeated float vector = 2;
  optional string text = 3;
  uint32 k = 4;
  optional Filter filter = 5;
  optional Metric metric = 6;
  // Absent takes the server default. Must be finite and strictly positive.
  optional double rrf_k = 7;
  // Absent takes the server default. An explicit zero is rejected.
  optional uint32 overfetch_factor = 8;
}
message Hit {
  // Exactly 16 bytes, same encoding as Point.id.
  bytes id = 1;
  // Higher is closer, whatever the metric: cosine similarity in [-1, 1],
  // raw dot product, negated euclidean distance. For SearchHybrid, the
  // reciprocal rank fusion score, also higher is closer.
  float score = 2;
  optional Payload payload = 3;
}
message SearchResponse { repeated Hit hits = 1; }
message SearchHybridResponse { repeated Hit hits = 1; }

message UpsertRequest { string collection = 1; Point point = 2; }
message UpsertResponse {}
message BatchUpsertRequest { PointBatch batch = 1; }
message BatchUpsertResponse { uint64 upserted = 1; }
message BulkUpsertRequest { PointBatch batch = 1; }
message BulkUpsertResponse { uint64 upserted = 1; }
message DeleteRequest {
  string collection = 1;
  // Exactly 16 bytes, same encoding as Point.id.
  bytes id = 2;
}
message DeleteResponse { bool existed = 1; }
message DeleteByFilterRequest { string collection = 1; Filter filter = 2; }
message DeleteByFilterResponse { uint64 deleted = 1; }
message CompactRequest { string collection = 1; }
message CompactResponse {}

service EidosDbService {
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc DescribeCollection(DescribeCollectionRequest) returns (DescribeCollectionResponse);
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc BatchUpsert(BatchUpsertRequest) returns (BatchUpsertResponse);
  rpc BulkUpsert(stream BulkUpsertRequest) returns (BulkUpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc DeleteByFilter(DeleteByFilterRequest) returns (DeleteByFilterResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc SearchHybrid(SearchHybridRequest) returns (SearchHybridResponse);
  rpc Compact(CompactRequest) returns (CompactResponse);
}
