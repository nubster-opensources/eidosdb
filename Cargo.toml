[workspace]
resolver = "2"
members = [
    "crates/eidosdb-core",
    "crates/eidosdb-lexical",
    "crates/eidosdb-hnsw",
    "crates/eidosdb-query",
    "crates/eidosdb-storage",
    "crates/eidosdb-bench",
    "crates/eidosdb-proto",
    "crates/eidosdb-server",
    "crates/eidosdb-client",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nubster-opensources/eidosdb"
homepage = "https://github.com/nubster-opensources/eidosdb"
authors = ["Nubster"]
keywords = ["vector-database", "ann", "similarity-search", "embeddings", "hnsw"]
categories = ["database", "data-structures", "algorithms"]

[workspace.dependencies]
thiserror = "2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
uuid = { version = "1", features = ["v7"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
proptest = "1"
redb = "2"
memmap2 = "0.9"
bytemuck = "1"
tempfile = "3"
tonic = { version = "0.14", features = ["transport"] }
prost = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
